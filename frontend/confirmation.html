<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmed | MatAir</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo-container">
            <div class="logo-icon"></div>
            <div class="logo-text">MAT<span>AIR</span></div>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Flights</a></li>
                <li><a href="dashboard.html">My Bookings</a></li>
                <li id="auth-links"></li>
            </ul>
        </nav>
    </header>

    <main style="max-width: 800px; margin: 4rem auto; padding: 0 2rem; text-align: center;">
        <div class="animate">
            <div style="width: 80px; height: 80px; background: var(--success); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; margin: 0 auto 2rem;">✓</div>
            <h1 style="color: var(--success);">Booking Confirmed!</h1>
            <p style="color: var(--text-secondary); margin-top: 1rem;">Pack your bags! Your journey with MatAir is officially booked.</p>
        </div>

        <div id="booking-container" style="margin-top: 3rem;">
            <!-- Populated by JS -->
        </div>

        <div style="margin-top: 3rem; display: flex; gap: 1rem; justify-content: center;">
            <button class="btn-primary" onclick="window.print()">Print Tickets</button>
            <button class="btn-secondary" onclick="window.location.href='dashboard.html'">View My Bookings</button>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const data = JSON.parse(sessionStorage.getItem('last_booking_final'));
            const container = document.getElementById('booking-container');

            if (!data) {
                window.location.href = 'index.html';
                return;
            }

            function renderCard(booking, title) {
                if (!booking) return '';
                return `
                    <div class="card" style="text-align: left; border-top: 5px solid var(--success); margin-bottom: 2rem;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 2rem;">
                            <div>
                                <p style="font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase;">${title} - Booking ID</p>
                                <h2 style="color: var(--primary-red);">${booking.booking_id}</h2>
                            </div>
                            <div style="text-align: right;">
                                <p style="font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase;">Status</p>
                                <span style="background: rgba(40, 167, 69, 0.1); color: var(--success); padding: 0.3rem 0.8rem; border-radius: 20px; font-weight: 700; font-size: 0.8rem;">● ${booking.status}</span>
                            </div>
                        </div>

                        <div style="border-top: 1px dashed var(--light-gray); border-bottom: 1px dashed var(--light-gray); padding: 1.5rem 0; margin-bottom: 1.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                            <div>
                                <p style="font-size: 0.75rem; color: var(--text-secondary);">Flight</p>
                                <p style="font-weight: 700;">${booking.flight_id}</p>
                            </div>
                            <div>
                                <p style="font-size: 0.75rem; color: var(--text-secondary);">Class</p>
                                <p style="font-weight: 700; text-transform: capitalize;">${booking.class}</p>
                            </div>
                            <div>
                                <p style="font-size: 0.75rem; color: var(--text-secondary);">Departure Date</p>
                                <p style="font-weight: 700;">${booking.travel_date}</p>
                            </div>
                            <div>
                                <p style="font-size: 0.75rem; color: var(--text-secondary);">Seats</p>
                                <p style="font-weight: 700;">${booking.seats.join(', ')}</p>
                            </div>
                        </div>

                        <div>
                            <p style="font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.5rem;">Passengers</p>
                            ${booking.passengers.map(p => `
                                <div style="display: flex; justify-content: space-between; margin-bottom: 0.3rem; font-size: 0.9rem;">
                                    <span>${p.name} (${p.age}, ${p.gender})</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = renderCard(data.outbound, 'Outbound Leg');
            if (data.inbound) {
                container.innerHTML += renderCard(data.inbound, 'Return Leg');
            }
        });
    </script>
</body>
</html>
