<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard | MatAir</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo-container">
            <div class="logo-icon"></div>
            <div class="logo-text">MAT<span>AIR</span></div>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Book Flights</a></li>
                <li><a href="dashboard.html" class="active">My Bookings</a></li>
                <li id="auth-links"></li>
            </ul>
        </nav>
    </header>

    <main style="max-width: 1000px; margin: 2rem auto; padding: 0 2rem;">
        <div class="results-header">
            <div>
                <h1>Welcome, <span id="user-display-name">Guest</span></h1>
                <p style="color: var(--text-secondary);">Manage your trips and frequent flyer details.</p>
            </div>
            <button class="btn-primary" onclick="window.location.href='index.html'">Book New Trip</button>
        </div>

        <section style="margin-top: 3rem;">
            <h3 style="margin-bottom: 1.5rem; display: flex; align-items: center; gap: 10px;">
                <span style="color: var(--primary-red);">✈</span> Recent Bookings
            </h3>
            <div id="bookings-list">
                <!-- Loading placeholder -->
                <div class="card" style="text-align: center; padding: 3rem;">
                    <p>Fetching your flight history...</p>
                </div>
            </div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = API.getUser();
            if (!user) {
                window.location.href = 'login.html';
                return;
            }

            document.getElementById('user-display-name').textContent = user.username;
            const bookingsList = document.getElementById('bookings-list');

            const response = await API.get(`/bookings?user_id=${user.user_id}`);

            if (response.success && response.bookings.length > 0) {
                bookingsList.innerHTML = '';
                response.bookings.reverse().forEach(booking => {
                    const info = booking.flight_info || { airline: 'MatAir', source: '?', destination: '?' };
                    const card = document.createElement('div');
                    card.className = 'card animate';
                    card.style.padding = '1.5rem';
                    card.style.display = 'grid';
                    card.style.gridTemplateColumns = '1fr 1fr 150px';
                    card.style.alignItems = 'center';
                    card.style.gap = '2rem';
                    card.style.borderLeft = `5px solid ${booking.status === 'Confirmed' ? 'var(--success)' : 'var(--text-secondary)'}`;

                    card.innerHTML = `
                        <div>
                            <span style="font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase;">${booking.booking_id}</span>
                            <h3 style="margin: 0.2rem 0;">${info.source} ➔ ${info.destination}</h3>
                            <p style="font-size: 0.9rem; color: var(--text-secondary);">${booking.travel_date} | ${info.departure_time}</p>
                        </div>
                        <div>
                            <p style="font-size: 0.85rem;"><span style="color: var(--text-secondary);">Class:</span> ${booking.class.charAt(0).toUpperCase() + booking.class.slice(1)}</p>
                            <p style="font-size: 0.85rem;"><span style="color: var(--text-secondary);">Seats:</span> ${booking.seats.join(', ')}</p>
                            <span style="font-size: 0.8rem; font-weight: 700; color: ${booking.status === 'Confirmed' ? 'var(--success)' : 'var(--text-secondary)'};">
                                ● ${booking.status}
                            </span>
                        </div>
                        <div style="text-align: right;">
                            <p style="font-weight: 700; margin-bottom: 1rem;">₹${booking.total_price.toLocaleString()}</p>
                            ${booking.status === 'Confirmed' ? `
                                <button class="btn-secondary" style="padding: 0.5rem 1rem; font-size: 0.8rem;" onclick="cancelBooking('${booking.booking_id}')">Cancel</button>
                            ` : ''}
                        </div>
                    `;
                    bookingsList.appendChild(card);
                });
            } else {
                bookingsList.innerHTML = `
                    <div class="card" style="text-align: center; padding: 4rem;">
                        <img src="https://cdn-icons-png.flaticon.com/512/3125/3125856.png" style="width: 80px; opacity: 0.2; margin-bottom: 1.5rem;">
                        <h3>No Bookings Found</h3>
                        <p style="color: var(--text-secondary); margin-top: 0.5rem;">You haven't made any bookings yet. Ready to start your adventure?</p>
                        <button class="btn-primary" style="margin-top: 1.5rem;" onclick="window.location.href='index.html'">Search Flights</button>
                    </div>
                `;
            }
        });

        async function cancelBooking(id) {
            if (!confirm('Are you sure you want to cancel this booking?')) return;
            
            const user = API.getUser();
            const response = await API.post('/cancel', { 
                booking_id: id,
                user_id: user.user_id
            });

            if (response.success) {
                alert('Booking cancelled successfully.');
                window.location.reload();
            } else {
                alert('Cancellation failed: ' + response.message);
            }
        }
    </script>
</body>
</html>
