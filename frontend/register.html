<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | MatAir</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo-container">
            <div class="logo-icon"></div>
            <div class="logo-text">MAT<span>AIR</span></div>
        </a>
    </header>

    <main style="display: flex; justify-content: center; align-items: center; min-height: 80vh; padding: 2rem;">
        <div class="card animate" style="width: 100%; max-width: 450px; padding: 2.5rem;">
            <div style="text-align: center; margin-bottom: 2rem;">
                <h1 style="color: var(--primary-red); margin-bottom: 0.5rem;">Fly with Us</h1>
                <p style="color: var(--text-secondary); font-size: 0.9rem;">Join the MatAir family for a seamless travel experience.</p>
            </div>

            <form id="register-form">
                <div class="form-group" style="margin-bottom: 1.2rem;">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Choose a username" required>
                </div>
                <div class="form-group" style="margin-bottom: 1.2rem;">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="email@airline.com" required>
                </div>
                <div class="form-group" style="margin-bottom: 1.2rem;">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a strong password" required>
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" placeholder="Repeat password" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; padding: 1rem; font-size: 1rem;">Create Account</button>
            </form>

            <p style="text-align: center; margin-top: 2rem; font-size: 0.9rem; color: var(--text-secondary); border-top: 1px solid var(--light-gray); padding-top: 1.5rem;">
                Already have an account? <a href="login.html" style="color: var(--primary-red); font-weight: 600; text-decoration: none;">Sign In</a>
            </p>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirm-password').value;

            if (password !== confirm) {
                alert('Passwords do not match!');
                return;
            }

            const response = await API.post('/register', { username, email, password });

            if (response.success) {
                API.saveUser(response.user);
                alert('Registration successful!');
                window.location.href = 'dashboard.html';
            } else {
                alert(response.message || 'Registration failed');
            }
        });
    </script>
</body>
</html>
