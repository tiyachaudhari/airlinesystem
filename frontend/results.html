<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Results | MatAir</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo-container">
            <div class="logo-icon"></div>
            <div class="logo-text">MAT<span>AIR</span></div>
        </a>
        <nav>
            <ul>
                <li><a href="index.html">Flights</a></li>
                <li><a href="dashboard.html">My Bookings</a></li>
                <li id="auth-links">
                    <a href="login.html" class="nav-btn nav-link-btn">Login</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <div id="selection-progress" style="background: var(--dark-gray); color: white; padding: 1rem 5%; display: none;">
            <div style="max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
                <h3 id="progress-text">Step 1: Select Outbound Flight</h3>
                <div id="selected-outbound" style="font-size: 0.9rem; opacity: 0.8;"></div>
            </div>
        </div>

        <div class="results-header">

            <div>
                <h1 id="route-title">Searching for flights...</h1>
                <p id="search-details" style="color: var(--text-secondary);"></p>
            </div>
            <button class="btn-secondary" onclick="window.location.href='index.html'">Modify Search</button>
        </div>

        <div id="results-container" style="padding-bottom: 5rem;">
            <!-- Loading state -->
            <div style="text-align: center; padding: 5rem;">
                <div style="width: 40px; height: 40px; border: 4px solid var(--light-gray); border-top-color: var(--primary-red); border-radius: 50%; margin: 0 auto 1rem; animation: spin 1s linear infinite;"></div>
                <p>Finding the best flights for you...</p>
            </div>
        </div>
    </main>

    <style>
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <script src="js/api.js"></script>
    <script src="js/results.js"></script>
</body>
</html>
