
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matair
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matair
  template:
    metadata:
      labels:
        app: matair
    spec:
      imagePullSecrets:
          - name: ecr-secret
      containers:
        - name: matair
          image: 013644998183.dkr.ecr.ap-south-1.amazonaws.com/matair:v1
          ports:
            - containerPort: 8080
